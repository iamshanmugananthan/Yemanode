[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yemanode"
version = "2.0.0"
description = "Powerful multi-target ethical security scanner: source code, APK, APIs, and binaries. Generates detailed Markdown fix reports."
requires-python = ">=3.8"
dependencies = [
    "click>=8.0",
    "requests>=2.28",
]

[project.scripts]
yemanode = "yemanode.cli:main"

[tool.setuptools]
packages = [
    "yemanode",
    "yemanode.detectors",
    "yemanode.scanners",
]
